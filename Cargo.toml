[package]
name = "syschk"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Guided system health checks and failure diagnosis for Ubuntu, in your terminal"
license = "MIT OR Apache-2.0"
repository = "https://github.com/doosik/syschk"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
