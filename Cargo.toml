[package]
name = "syschk"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Guided system health checks and failure diagnosis for Ubuntu, in your terminal"
license = "MIT OR Apache-2.0"
repository = "https://github.com/doosik/syschk"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# 파일시스템 여유 용량과 inode 수는 커널이 /proc 로 노출하지 않는다. statvfs 한 함수만 쓴다.
libc = "0.2"
ratatui = "0.30"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
